<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coinsole</title>
<style>
  /* fonts are bundled with the app (no internet needed); both under the SIL Open Font License, see fonts/README.txt */
  @font-face { font-family: "Press Start 2P"; font-style: normal; font-weight: 400; font-display: block; src: url("fonts/PressStart2P.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: block; src: url("fonts/Inter.woff2") format("woff2"); }
  :root {
    --bg0: #0b0616; --bg1: #2a0f52;

    --panel: rgba(28, 24, 40, 0.92); --panel-edge: rgba(255, 255, 255, 0.07);
    --violet: #8b5cf6; --violet-glow: rgba(139, 92, 246, 0.75);
    --cream: #f6ead0; --text: #ece9f4; --muted: #9d97b0;
    --pixel: "Press Start 2P", ui-monospace, Menlo, monospace;
    --ui: Inter, -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #15121c;
    color: var(--text); font-family: var(--ui);
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .abs { position: absolute; }

  /* ---------- screen ---------- */
  .crt { overflow: hidden; }
  .crt .layer { position: absolute; inset: 0; }
  .fx { pointer-events: none; z-index: 20; }
  .fx.vignette { background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 85%, rgba(0,0,0,0.9) 100%); }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.985; } }
  .crt .content { animation: flicker 0.12s infinite; }

  /* attract screen */
  .cover { background-size: cover; background-position: 22% center; image-rendering: pixelated; filter: saturate(1.15) contrast(1.05); transition: opacity 0.3s; }
  .cover.dim { filter: saturate(0.6) brightness(0.35); }
  .attract-shade { background: linear-gradient(180deg, rgba(5,3,8,0.0) 45%, rgba(5,3,8,0.9) 88%); }
  .hud { font-family: var(--pixel); text-transform: uppercase; z-index: 10; }
  .hud.top { left: 52px; right: 52px; top: 40px; display: flex; justify-content: space-between; font-size: 16px; line-height: 1.6; text-shadow: 2px 2px 0 #000; }
  .yellow { color: #ffe14d; } .pink { color: #ff4f9a; } .cyan { color: #5ff0ff; } .white { color: #fff; }
  .hud.title { left: 24px; right: 24px; bottom: 96px; text-align: center; font-size: 26px; line-height: 1.4; color: #fff; text-shadow: 3px 3px 0 #000, 0 0 18px rgba(139,92,246,0.8); }
  .hud.press { left: 0; right: 0; bottom: 56px; text-align: center; font-size: 16px; color: #ffe14d; text-shadow: 2px 2px 0 #000; }
  .hud.hint { left: 0; right: 0; bottom: 26px; text-align: center; font-size: 10px; color: #b9b2cc; text-shadow: 1px 1px 0 #000; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }

  /* game grid + settings inside the screen */
  .screen-page { padding: 40px 48px; z-index: 10; font-family: var(--pixel); overflow-y: auto; scrollbar-width: none; }
  .screen-page::-webkit-scrollbar { display: none; }
  .screen-page h2 { margin: 0 0 22px; font-size: 18px; color: #ffe14d; font-weight: 400; text-shadow: 2px 2px 0 #000; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tile { border-radius: 10px; overflow: hidden; background: #120d1c; border: 2px solid rgba(255,255,255,0.08); }
  .tile .img { height: 104px; background-size: cover; background-position: center; image-rendering: pixelated; }
  .tile .name { padding: 9px 10px; font-size: 9px; line-height: 1.5; color: #ddd8ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.sel { border-color: var(--violet); box-shadow: 0 0 0 2px var(--violet), 0 0 18px var(--violet-glow); }
  .tile.sel .name { color: #fff; }
  .menu-list { list-style: none; margin: 0; padding: 0; }
  .menu-list li { font-size: 14px; padding: 13px 16px; margin-bottom: 6px; border-radius: 8px; color: #ddd8ea; }
  .menu-list li.sel { background: rgba(139,92,246,0.35); color: #fff; box-shadow: inset 0 0 0 2px var(--violet); }
  .menu-list li.sel::before { content: "▶ "; color: #ffe14d; }
  .menu-list li.look { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .menu-list li.look.sel::before { margin-right: -4px; }
  .menu-list .chip { font: 11px var(--pixel); color: #ddd8ea; padding: 9px 11px; margin: -7px 0; border-radius: 7px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.22); }
  .menu-list .chip:first-of-type { margin-left: auto; }
  .menu-list .chip:hover { background: rgba(255,255,255,0.1); }
  .menu-list .chip.on { color: #04120a; background: #3ddc84; box-shadow: none; }
  body.skin-ps .menu-list .chip.on { color: #fff; background: #0070d1; }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 22px; font-family: var(--pixel); }
  .empty .big { font-size: 22px; color: #ffe14d; text-shadow: 2px 2px 0 #000; }
  .empty .small { font-size: 11px; color: #c9c2da; line-height: 2; }
  iframe.game { border: 0; width: 100%; height: 100%; background: #000; z-index: 5; }
  .exit { right: 34px; top: 26px; z-index: 30; }
  .toast { left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 40; font-family: var(--pixel); font-size: 10px; padding: 10px 14px; border-radius: 6px; background: rgba(0,0,0,0.85); border: 1px solid var(--violet); color: #fff; white-space: nowrap; opacity: 0; transition: opacity 0.25s; }
  .toast.show { opacity: 1; }
  .dropping .xframe { box-shadow: 0 0 0 4px #ffe14d, 0 0 40px #ffe14d; }

  .pt-hint { text-align: center; font-size: 9px; color: #9d97b0; margin-top: 12px; }
  /* =================== XBOX LOOK =================== */
  body { background: radial-gradient(ellipse at 50% 110%, #12461d 0%, #07150a 45%, #040805 75%); }
  #xstage { position: absolute; left: 50%; top: 50%; width: 1672px; height: 940px; transform-origin: 50% 50%; font-family: var(--ui); color: #f2f5f2; }
  :root { --xg: #3ddc84; --xg2: #1fbf5b; --xglow: rgba(61, 220, 132, 0.55); --xcard: rgba(22, 30, 24, 0.92); --xedge: rgba(255, 255, 255, 0.07); }
  .xarc { border-radius: 50%; border-top: 3px solid var(--xg); box-shadow: 0 -12px 50px var(--xglow), inset 0 12px 40px rgba(61,220,132,0.15); }
  .xbrand { left: 72px; top: 32.3px; display: flex; align-items: center; gap: 22px; }
  .xbrand .brand { width: 205.3px; height: 39.4px; color: #ffffff; filter: drop-shadow(0 0 12px rgba(61,220,132,0.35)); }
  .xnav { left: 478px; top: 22px; display: flex; gap: 10px; }
  .xnav button { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 26px; border-radius: 30px; font-size: 21px; font-weight: 600; color: #e6ece7; }
  .xnav button svg, .xside svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .xnav button:hover { background: rgba(255,255,255,0.05); }
  .xnav button.on { box-shadow: inset 0 0 0 3px var(--xg), 0 0 22px var(--xglow); background: rgba(61,220,132,0.1); color: #fff; }
  .xprofile { right: 62px; top: 18px; width: 66px; height: 66px; border-radius: 50%; background: #0d1a10; box-shadow: inset 0 0 0 3px var(--xg), 0 0 20px var(--xglow); display: grid; place-items: center; }
  .xprofile svg { width: 38px; height: 26px; }
  .xprofile .dot { position: absolute; right: -2px; bottom: 2px; width: 16px; height: 16px; border-radius: 50%; background: #5a5f5b; box-shadow: 0 0 0 3px #07150a; }
  .xprofile.ok .dot { background: var(--xg); box-shadow: 0 0 0 3px #07150a, 0 0 12px var(--xg); }
  .xwallet { right: 206px; top: 27px; height: 48px; padding: 0 20px 0 12px; border-radius: 24px; display: flex; align-items: center; gap: 10px; font: 700 22px var(--ui); color: #ffd84a; background: var(--xcard); box-shadow: inset 0 0 0 2px rgba(255,216,74,0.45); }
  .xwallet svg { stroke: #ffd84a; fill: none; stroke-width: 1.8; }
  .xwallet svg { width: 30px; height: 30px; }
  .xwallet.on { box-shadow: inset 0 0 0 3px #ffd84a, 0 0 22px rgba(255,216,74,0.45); }
  .coin-burst { animation: coinpop 0.5s ease; }
  @keyframes coinpop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .packs li { display: flex; justify-content: space-between; gap: 24px; }
  .packs li .bonus { color: #ffd84a; }
  .wallet-line { margin: 6px 0 18px; color: #ffd84a; }
  .demo-note { margin-top: 16px; font-size: 0.75em; opacity: 0.6; }
  .xpower { right: 146px; top: 30px; width: 42px; height: 42px; border-radius: 50%; color: #9aa69d; display: grid; place-items: center; }
  .xpower:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .xpower svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  /* the side columns start and end level with the outline of the game screen (y 124 to 651) */
  .xinfo { left: 66px; top: 127px; width: 290px; }
  .xicon { width: 80px; height: 80px; border-radius: 14px; background-size: cover; background-position: 22% center; image-rendering: pixelated; box-shadow: 0 0 0 3px var(--xg), 0 0 18px var(--xglow); background-color: #0d1a10; }
  .xtitle { margin: 18px 0 8px; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .xmeta { font-size: 17px; font-weight: 600; color: #e9efe9; min-height: 22px; }
  .xdesc { margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #b7c2ba; height: 72px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .xbtns { left: 66px; top: 491px; width: 290px; height: 160px; display: flex; flex-direction: column; gap: 10px; }
  .xbtn { display: flex; align-items: center; gap: 16px; height: 44px; flex: none; padding: 0 12px 0 20px; border-radius: 22px; font-size: 18px; font-weight: 600; background: var(--xcard); box-shadow: inset 0 0 0 1px var(--xedge); text-align: left; }
  .xbtn:hover { background: #1d2a20; }
  .xbtn.play { height: 52px; border-radius: 26px; font-size: 21px; font-weight: 700; color: #04120a; background: linear-gradient(180deg, #5af08f, #23c45c); box-shadow: 0 0 26px var(--xglow); }
  .glyph { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 20px; background: #0b110d; box-shadow: inset 0 0 0 2.5px currentColor; }
  .glyph.a { color: var(--xg); } .glyph.b { color: #ff4d4d; } .glyph.x { color: #3d8bff; } .glyph.y { color: #ffd21f; }
  .xbtn.play .glyph { color: #0b110d; background: rgba(4,18,10,0.15); box-shadow: inset 0 0 0 2.5px #0b110d; }
  .xframe { left: 375px; top: 128px; width: 923px; height: 519px; border-radius: 36px; box-shadow: 0 0 0 4px var(--xg), 0 0 40px var(--xglow), 0 0 120px rgba(61,220,132,0.25); background: #000; }
  .crt.xcrt { left: 375px; top: 128px; width: 923px; height: 519px; border-radius: 36px; box-shadow: none; background: #000; }
  .xhint { left: 0; right: 0; bottom: 22px; text-align: center; font-family: var(--pixel); font-size: 13px; color: #fff; text-shadow: 2px 2px 0 #000; z-index: 10; }
  .sym { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 1.6em; line-height: 0; vertical-align: -0.09em; }
  .xhint .glyph { display: inline-grid; width: 26px; height: 26px; font-size: 14px; font-family: var(--ui); vertical-align: middle; margin-right: 8px; }
  .xlist { left: 1330px; top: 124px; width: 304px; height: 527px; display: flex; flex-direction: column; }
  .xlabel { font-size: 18px; line-height: 20px; font-weight: 600; color: #b7c2ba; margin: 0 0 14px 2px; }
  .xrows { display: flex; flex-direction: column; gap: 12px; }
  .xrow { display: flex; align-items: center; gap: 18px; height: 76px; padding: 0 10px; border-radius: 16px; background: var(--xcard); box-shadow: inset 0 0 0 1px var(--xedge); text-align: left; font-size: 20px; font-weight: 600; }
  .xrow .th { width: 96px; height: 58px; border-radius: 10px; flex: none; background-size: cover; background-position: center; image-rendering: pixelated; background-color: #0d1a10; }
  .xrow .nm { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
  .xrow.sel { box-shadow: inset 0 0 0 3px var(--xg), 0 0 22px var(--xglow); background: rgba(61,220,132,0.12); }
  .xadd { margin-top: auto; flex: none; width: 100%; height: 76px; border-radius: 16px; display: flex; align-items: center; gap: 22px; padding: 0 26px; font-size: 20px; font-weight: 600; background: var(--xcard); box-shadow: inset 0 0 0 1px var(--xedge); }
  .xadd i { font-style: normal; font-size: 30px; font-weight: 300; }
  .xadd.sel { box-shadow: inset 0 0 0 3px var(--xg), 0 0 22px var(--xglow); background: rgba(61,220,132,0.12); }
  .xpad { left: 381px; top: 640px; width: 910px; height: 622px; overflow: visible; transition: left 0.35s ease, top 0.35s ease, width 0.35s ease, height 0.35s ease; }
  .xpadinfo { display: none; left: 0; right: 0; top: 112px; text-align: center; }
  .xpadinfo .n { font: 700 30px var(--ui); color: #fff; }
  .xpadinfo .n small { font-size: 20px; font-weight: 600; color: var(--xg); margin-left: 14px; }
  .xpadinfo .l { margin-top: 10px; min-height: 30px; font: 700 22px var(--ui); color: var(--xg); text-shadow: 0 0 14px var(--xglow); letter-spacing: 1px; }
  .xpadinfo .h { margin-top: 6px; font: 600 15px var(--ui); color: #8e9a91; letter-spacing: 1px; }
  /* controller page: the controller takes the middle of the screen */
  body.xpadview .xframe, body.xpadview .xcrt, body.xpadview .xinfo, body.xpadview .xbtns, body.xpadview .xlist, body.xpadview .xfoot { display: none; }
  body.xpadview .xpadinfo { display: block; }
  body.xpadview .xpad { left: 326px; top: 266px; width: 1020px; height: 697px; }
  /* the look can be switched right on the controller page */
  .xpadinfo .looks { position: relative; z-index: 5; display: inline-flex; gap: 4px; margin-top: 14px; padding: 4px; border-radius: 26px; background: var(--xcard); box-shadow: inset 0 0 0 1px var(--xedge), 0 4px 14px rgba(0,0,0,0.12); }
  .xpadinfo .looks button { height: 36px; min-width: 88px; padding: 0 20px; border-radius: 20px; font: 700 15px var(--ui); color: #cfd8d1; }
  .xpadinfo .looks button:hover { background: rgba(128,150,140,0.18); }
  .xpadinfo .looks button.on { color: #04120a; background: var(--xg); box-shadow: 0 0 16px var(--xglow); }
  body.skin-ps .xpadinfo .looks button { color: #3a4458; }
  body.skin-ps .xpadinfo .looks button.on { color: #fff; }
  #xpad { --pa: var(--xg); --paglow: var(--xglow); }
  #xpad .body { filter: drop-shadow(0 -6px 24px rgba(61, 220, 132, 0.30)); }
  #xpad .accent { fill: none; stroke: var(--pa); stroke-width: 7; filter: drop-shadow(0 0 7px var(--paglow)); }
  #xpad .rim, #xpad .rimglow { fill: none; stroke: var(--pa); }
  #xpad .glowline { fill: none; stroke: var(--pa); stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 7px var(--pa)); }
  #xpad .led { fill: var(--pa); filter: drop-shadow(0 0 6px var(--pa)); }
  #xpad .spark { fill: var(--pa); filter: drop-shadow(0 0 5px var(--pa)); }
  #xpad .bumper { fill: url(#gBumper); transition: fill 0.05s; }
  #xpad .bumper.on { fill: var(--pa); }
  #xpad .trigger { fill: url(#gTrig); }
  .xpad .xstick { transition: transform 0.04s linear; }
  .xpad .xstick.on .ring { stroke: var(--xg); stroke-width: 5; filter: drop-shadow(0 0 10px var(--xg)); }
  #xpad .xstick.on .ring { stroke: var(--pa); stroke-width: 9; filter: drop-shadow(0 0 10px var(--pa)); }
  .xpad .arm { fill: transparent; transition: fill 0.05s; }
  .xpad .arm.on { fill: rgba(61,220,132,0.9); }
  #xpad .arm.on { fill: var(--pa); filter: drop-shadow(0 0 8px var(--paglow)); }
  .xpad .face > g, .xpad .small, .xpad .guide { transition: transform 0.05s; }
  .xpad .face.on .cap { fill: var(--c); filter: drop-shadow(0 0 14px var(--c)); }
  .xpad .face.on .letter { fill: #0b0c0c; }
  .xpad .letter { font: 800 42px var(--ui); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .xpad .small.on .cap, .xpad .guide.on .cap { fill: var(--xg); filter: drop-shadow(0 0 10px var(--xg)); }
  #xpad .small.on .cap, #xpad .guide.on .cap { fill: var(--pa); filter: drop-shadow(0 0 12px var(--pa)); }
  #xpad .letter { font-size: 64px; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.7)); }
  #xpad .face.on .letter { filter: none; }
  #xpad .guide .dome { transition: transform 0.05s; }
  #xpad .guide.on { transform: none; }
  #xpad .guide.on .dome { transform: translateY(4px); }
  #xpad #xp-dash text { font-family: var(--pixel); text-anchor: middle; dominant-baseline: central; }
  #xpad #xp-dlabel { font-size: 22px; fill: var(--pa); }
  #xpad #xp-dnum { font-size: 68px; fill: #ffd84d; filter: drop-shadow(0 0 8px rgba(255, 216, 77, 0.45)); }
  #xpad #xp-dpad { font-size: 19px; fill: #cfe9da; }
  #xpad #xp-dhint { font-size: 19px; fill: #fff; }
  #xpad #xp-gname { font: 700 25px var(--ui); fill: #fff; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.5px; }
  #xpad #xp-game.playing #xp-gname { fill: var(--pa); }
  .xfoot { bottom: 58px; display: flex; align-items: center; gap: 14px; font-size: 19px; font-weight: 600; color: #dfe6e0; }
  .xfoot .key { display: inline-grid; place-items: center; min-width: 40px; height: 28px; border-radius: 8px; box-shadow: inset 0 0 0 2px #cfd6d0; font-size: 15px; font-weight: 700; }
  .xfoot .glyph { width: 32px; height: 32px; font-size: 17px; }
  .xfoot span.gap { width: 26px; }
  body.booting #xstage { opacity: 0; }              /* dark until the launch animation starts */
  .xword { display: inline-block; white-space: pre; }
  .xfoot.xbig { bottom: 108px; height: 40px; gap: 10px; padding: 0 16px; margin-right: -16px; border-radius: 20px; font-family: var(--ui); }
  .xfoot.xbig:hover { background: rgba(128,150,140,0.16); }
  .xfoot.xbig svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .grid { grid-template-columns: repeat(4, 1fr); }
  .tile .img { height: 120px; }
  .xinfo-card { padding: 46px 56px; z-index: 10; }
  .xinfo-card h2 { margin: 0 0 6px; font: 800 38px var(--ui); color: #fff; }
  .xinfo-card .m { font: 600 18px var(--ui); color: var(--xg); margin-bottom: 18px; }
  .xinfo-card p { font: 400 19px/1.6 var(--ui); color: #cfd8d1; margin: 0 0 18px; max-width: 700px; }
  .xinfo-card .c { font: 600 16px/1.7 var(--ui); color: #fff; background: rgba(61,220,132,0.1); border-radius: 12px; padding: 12px 16px; box-shadow: inset 0 0 0 1px rgba(61,220,132,0.35); }

  /* ---------- big screen: a game in full screen, inside a neon arcade cabinet (Xbox green) ---------- */
  #tstage { display: none; position: absolute; left: 50%; top: 50%; width: 1672px; height: 940px; transform-origin: 50% 50%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #0f2a18, #040a06 70%); }
  body.theater #xstage { display: none !important; }
  body.theater #tstage { display: block; }
  .t-shape { left: 0; top: 0; width: 1672px; height: 940px; overflow: visible; }
  .t-name { left: 0; right: 0; top: 45px; height: 64px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .t-name b { font: 26px var(--pixel); color: #eafff1; letter-spacing: 3px; white-space: nowrap;
    text-shadow: 0 0 10px #3ddc84, 0 0 24px rgba(61,220,132,0.7), 3px 3px 0 #0e6b2f; }
  .t-name svg { width: 42px; height: 28px; flex: none; filter: drop-shadow(0 0 8px rgba(61,220,132,0.6)); }
  .t-crt .idle { position: absolute; inset: 0; background-size: cover; background-position: center; image-rendering: pixelated; }
  .t-crt .go { position: absolute; left: 0; right: 0; bottom: 24px; font-size: 15px; color: #fff; text-shadow: 2px 2px 0 #000, 0 0 10px #000; }
  .t-crt { border-radius: 18px; left: 416px; top: 162px; width: 840px; height: 630px; background: #000; overflow: hidden; }
  .t-crt .msg { position: absolute; inset: 0; display: grid; place-content: center; gap: 22px; text-align: center; font: 22px var(--pixel); color: #3ddc84; text-shadow: 0 0 12px rgba(61,220,132,0.7); }
  .t-crt .msg small { font-size: 13px; color: #cfe9d6; text-shadow: none; }

<script>
// ---------- pixel mascot (an original cloud sprite) ----------
const MASCOT = ["......XXX......", "....XXXXXXX....", "...XXXXXXXXX...", ".XXXXXXXXXXXXX.", "XXXXXXXXXXXXXXX", "XXXooXXXXXooXXX", "XXXooXXXXXooXXX", "XXXXXXXXXXXXXXX", ".XXXXXXXXXXXXX.", "..XX.XX.XX.XX.."];
for (const id of ["logoT1", "logoT2"]) {
  const svg = document.getElementById(id);
  MASCOT.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === ".") return;
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    Object.entries({ x, y, width: 1, height: 1, fill: c === "o" ? (id.startsWith("logoX") ? "#07150a" : "#1a1424") : id.startsWith("logoT") ? "#f6ead0" : id.startsWith("logoX") ? "#ffffff" : "#d9d3e6" }).forEach(([k, v]) => r.setAttribute(k, v));
    svg.appendChild(r);
  }));
}

// ---------- fit the stage to the window ----------
// cover the window edge to edge (the window keeps the stage's shape, so almost nothing is cut)
let stageScale = 1;
function fit() { const s = Math.max(innerWidth / 1672, innerHeight / 940); stageScale = s; for (const st of [document.getElementById("xstage"), document.getElementById("tstage")]) st.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();

// ---------- bridge to the Mac app (falls back to a demo in a normal browser) ----------
const native = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.arcade);
function send(cmd, data = {}) {
  if (native) window.webkit.messageHandlers.arcade.postMessage({ cmd, ...data });
  else demo(cmd, data);
}
function demo(cmd, data) {
  if (cmd === "list") setTimeout(() => receive({ type: "list", games: [
    { id: "demo-1", name: "Your game here", kind: "app", thumb: null },
    { id: "demo-2", name: "Another game", kind: "app", thumb: null },
  ], favorites: [] }), 50);
  if (cmd === "launch") { S.credits--; receive({ type: "running", id: data.id }); setTimeout(() => receive({ type: "stopped", id: data.id }), 2500); }
  if (cmd === "add" || cmd === "reveal") toast("Open Coinsole.app to add games");
}

// ---------- state ----------
const store = { get(k, d) { try { const v = localStorage.getItem("arcade." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("arcade." + k, JSON.stringify(v)); } catch {} } };
const S = { skinPref: store.get("skin", "auto"), paused: false, pad: { connected: false, name: "", battery: -1 }, games: [], favorites: [], sel: 0, view: "home", credits: native ? 0 : 10, running: null, web: null, gridSel: 0, setSel: 0, confirm: null, topScore: 0,
  sound: store.get("sound", true) };
const VERSION = "1.0";
// button names for the controller in use: Xbox letters, or PlayStation symbols
const PS_NAMES = { a: "✕", b: "○", x: "□", y: "△", l: "L1", r: "R1" }, XB_NAMES = { a: "A", b: "B", x: "X", y: "Y", l: "L", r: "R" };
const KB_NAMES = { a: "⏎", b: "esc", x: "F", y: "I", l: "↑", r: "↓" }, KB_WORDS = { a: "ENTER", b: "ESC", x: "F", y: "I", l: "UP", r: "DOWN" };
const BTN = (k) => (S.keys ? KB_NAMES : S.ps ? PS_NAMES : XB_NAMES)[k];
// the same name inside pixel-font text: that font draws ✕ ○ □ △ as specks, so the symbols get a readable one
const PXBTN = (k) => (S.keys ? KB_WORDS[k] : S.ps && "abxy".includes(k) ? `<span class="sym">${BTN(k)}</span>` : BTN(k));
function setButtonNames() {
  for (const k of ["a", "b", "x", "y"]) document.querySelectorAll(".glyph." + k).forEach((e) => (e.textContent = BTN(k)));
  document.querySelectorAll(".xfoot .kl").forEach((e) => (e.textContent = BTN("l")));
  document.querySelectorAll(".xfoot .kr").forEach((e) => (e.textContent = BTN("r")));
  document.querySelector("#xpadinfo .h").textContent = S.keys ? "← → CHANGE THE LOOK · ESC TO GO BACK" : `HOLD ${BTN("b")} OR PRESS ESC TO GO BACK`;
  document.getElementById("xpadlast").textContent = "";
}
function openWebsite() { beep("start"); if (native) send("website"); else window.open("https://faustomelchiorre.com/", "_blank"); }
const cur = () => S.games[S.sel];
const onAdd = () => S.view === "home" && S.sel >= S.games.length;   // "Add game" is selected
// three looks share one layout: dark Xbox, light PlayStation and a keyboard. scr() is the screen games and menus are drawn on
const scr = () => document.getElementById("xscreen");
const crtEl = () => document.getElementById(S.theater ? "tcrt" : "xcrt");
const SKIN_NAMES = { xbox: "DARK", ps: "LIGHT", keys: "KEYS", auto: "AUTO" };
const LOOKS = Object.keys(SKIN_NAMES);
function setLook(look) { S.skinPref = look; store.set("skin", look); }
const stepLook = (d) => setLook(LOOKS[(LOOKS.indexOf(S.skinPref) + d + LOOKS.length) % LOOKS.length]);
// auto: follow the connected controller; with none connected (e.g. the pad is asleep) keep the look of the last one
// used, and show the keyboard to someone who has never connected one
const skinForPad = (name, kind) => (kind === "ps" || /dualsense|dualshock|playstation|ps5|ps4/i.test(name || "") ? "ps" : "xbox");
if (!LOOKS.includes(S.skinPref)) setLook("auto");          // an older choice, from a look that no longer exists
function effectiveSkin() {

function receive(msg) {
  if (msg.type === "list") {
    if (!boot.started) setTimeout(playIntro, 120);        // a moment for the wallet and controller to report too
    S.waitingAccess = false;
    const keep = cur() && cur().id;
    S.games = msg.games; S.favorites = msg.favorites || [];
    const i = S.games.findIndex((g) => g.id === (msg.select || keep));
    S.sel = i >= 0 ? i : Math.min(S.sel, Math.max(0, S.games.length - 1));
    render();
  } else if (msg.type === "wallet") { const up = msg.credits > S.credits; S.credits = msg.credits; if (up) coinPop(); render(); }
  else if (msg.type === "needCredits") { beep("err"); toast("OUT OF CREDITS: GET MORE AT THE TOKEN MACHINE"); setView("credits"); }
  else if (msg.type === "spent") { S.spending = null; const g = S.games.find((x) => x.id === msg.id); if (g && !S.web) { playWeb(g); render(); } }
  else if (msg.type === "theater") { S.theater = !!msg.on; document.body.classList.toggle("theater", S.theater); render(); }
  else if (msg.type === "running") { S.running = msg.id; S.paused = false; S.gameWaiting = false; render(); }
  else if (msg.type === "stopped") {
    const closed = S.running === msg.id;
    if (closed) { S.running = null; S.paused = false; S.gameWaiting = false; }
    render();
    if (closed && S.next) { const next = S.next; S.next = null; setTimeout(() => startGame(next), 400); }   // the game you chose instead
  }
  else if (msg.type === "gameWaiting") { if (S.running === msg.id) { S.gameWaiting = true; render(); } }
  else if (msg.type === "paused") { if (S.running) { S.paused = true; render(); } }
  else if (msg.type === "access") { S.waitingAccess = !!msg.waiting; render(); }
  else if (msg.type === "pad") {
    nativePad = msg; if (S.ps) updatePsPad(); else if (!S.keys) updateXPad();
    // a game playing on the screen gets the controller too
    if (S.web) webFrame()?.contentWindow?.postMessage({ type: "arcade-pad", b: msg.b, a: msg.a }, S.webOrigin);   // that game only
    const guide = !!(msg.b || [])[16];
    if (guide && !S.guideWasDown && !boot.on) toggleBigScreen();                     // the Xbox / PS button: big screen on/off
    S.guideWasDown = guide;
  }
  else if (msg.type === "padStatus") {
    const was = S.pad.connected; S.pad = msg;
    if (msg.connected) store.set("lastPadSkin", skinForPad(msg.name, msg.kind));
    if (msg.connected && !was) toast("CONTROLLER CONNECTED"); else if (!msg.connected && was) toast("CONTROLLER DISCONNECTED");
    renderPadStatus(); if (S.view === "padtest") { renderScreen(); renderX(); }
  }
  else if (msg.type === "key") lightKey(msg.code, msg.down);   // keys pressed anywhere in Coinsole, even inside a game
  else if (msg.type === "toast") toast(msg.text);
  else if (msg.type === "exitGame") exitWeb();
  else if (msg.type === "dragging") document.body.classList.toggle("dropping", !!msg.on);
}

let ac;
function beep(kind) {

    ac = ac || new AudioContext();
    const seq = { move: [[660, 0.04]], coin: [[988, 0.07], [1319, 0.22]], start: [[523, 0.08], [659, 0.08], [784, 0.08], [1047, 0.25]], back: [[440, 0.06], [330, 0.1]], fav: [[880, 0.06], [1175, 0.12]], err: [[180, 0.2]] }[kind] || [[600, 0.05]];
    let t = ac.currentTime;
    for (const [f, d] of seq) {

      o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

}

// a game can say its shape in its info file, e.g. "aspect": "8:7" (default: widescreen 16:9)
function aspectOf(g) {

  if (typeof a === "number" && a > 0) return a;
  const m = typeof a === "string" && a.match(/^\s*(\d+(?:\.\d+)?)\s*[:x\/]\s*(\d+(?:\.\d+)?)\s*$/);
  return m && +m[2] > 0 ? +m[1] / +m[2] : 16 / 9;
}
// big screen: the screen takes the game's shape (4:3, or wide for a 16:9 game), centred in the bezel
function layoutTheater(g) {

  const crt = document.getElementById("tcrt");
  Object.assign(crt.style, { left: Math.round(cx - W / 2) + "px", top: Math.round(cy - H / 2) + "px", width: W + "px", height: H + "px" });
  document.querySelectorAll("#tstage .tframe").forEach((r) => {
    r.setAttribute("x", Math.round(cx - W / 2) - 3); r.setAttribute("y", Math.round(cy - H / 2) - 3);
    r.setAttribute("width", W + 6); r.setAttribute("height", H + 6); r.setAttribute("rx", 21);

}

function buildKeyboard() {

  else if (S.view === "games" || S.view === "favorites") { const n = pageGames().length; if (!n) return; S.gridSel = Math.max(0, Math.min(n - 1, S.gridSel + dx + dy * 4)); }
  else if (S.view === "settings") { const items = settingsItems(), n = items.length; if (dx && items[S.setSel]?.look) stepLook(dx); S.setSel = (S.setSel + dy + n) % n; S.confirm = null; }
  else if (S.view === "padtest") { if (!dx) return; stepLook(dx); }              // ← → switch the look
  else if (S.view === "credits") { const n = PACKS.length; S.buySel = ((S.buySel || 0) + (dy || dx) + n) % n; }
  beep("move"); render();
}

// ---------- menus: arrow keys, or a real gamepad / arcade stick ----------
// holding a direction moves once, then repeats after a short pause, like a real menu
const hold = { dir: null, timer: null };
function holdDir(dx, dy) {
  const key = dx || dy ? dx + "," + dy : null;
  if (hold.dir === key) return;
  clearTimeout(hold.timer); hold.dir = key;
  if (!key) return;
  const step = (delay) => { move(dx, dy); hold.timer = setTimeout(() => step(130), delay); };
  step(380);
}
// a USB / Bluetooth gamepad or arcade stick drives the menus (not the game while one is open)
const pad = { prev: {}, dir: "0,0" };
let nativePad = {};
function currentPad() {
  if (native) return S.pad.connected && nativePad.b ? { buttons: nativePad.b.map((v) => ({ pressed: !!v })), axes: nativePad.a || [] } : null;
  return navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
}
function pollPads() {
  const gp = currentPad();
  if (boot.on) {                       // during the launch animation a button only skips it
    if (gp && gp.buttons.some((x) => x && x.pressed)) { gp.buttons.forEach((x, i) => (pad.prev[i] = !!(x && x.pressed))); endIntro(); }
    requestAnimationFrame(pollPads);
    return;
  }
  if (gp && S.view === "padtest") {
    // test screen: nothing navigates; hold B to leave
    const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
    if (b(1)) { pad.bSince = pad.bSince || performance.now(); if (performance.now() - pad.bSince > 1000) { pad.bSince = 0; beep("back"); setView("home"); } }
    else pad.bSince = 0;
    for (let i = 0; i < 17; i++) pad.prev[i] = b(i);
    pad.dir = "0,0";
  } else if (gp && (!S.running || S.paused)) {
    const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
    let dx = (b(15) ? 1 : 0) - (b(14) ? 1 : 0), dy = (b(13) ? 1 : 0) - (b(12) ? 1 : 0);
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (!dx && !dy && Math.max(Math.abs(ax), Math.abs(ay)) > 0.5) { if (Math.abs(ax) > Math.abs(ay)) dx = Math.sign(ax); else dy = Math.sign(ay); }
    const edge = (i, fn) => { const on = b(i); if (on && !pad.prev[i]) fn(); pad.prev[i] = on; };
    if (S.web) edge(8, exitWeb); // Select/Back leaves a game playing on the screen
    else {
      const key = dx + "," + dy;
      if (key !== pad.dir) { pad.dir = key; holdDir(dx, dy); }
      edge(0, start1P);                                          // A / bottom button
      edge(9, start1P);                                                                    // Start
      // B: back. With a game open (paused) it quits only when held for a second, because B is also
      // "throw" in games and a quick press must never close the game by accident.
      if (S.running) {
        if (b(1)) { pad.bQuit = pad.bQuit || performance.now(); if (pad.bQuit > 0 && performance.now() - pad.bQuit > 1000) { pad.bQuit = -1; stopGame("B held on the pad"); } }
        else pad.bQuit = 0;
        pad.prev[1] = b(1);
      } else edge(1, () => { if (idleBigScreen()) bigScreen(false); else if (S.view !== "home") { beep("back"); setView("home"); } });
      edge(2, toggleFav);                                        // X favorite
      edge(3, showInfo);                                                                   // Y game info
      edge(4, () => move(0, -1));                                                          // LB previous
      edge(5, () => move(0, 1));                                                           // RB next
      edge(8, insertCoin);                                                                 // Select / Back
    }
  }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);
if (!native) addEventListener("gamepadconnected", () => toast("CONTROLLER CONNECTED"));
function renderPadStatus() {
  updatePadScreen();
  document.getElementById("xprofile").classList.toggle("ok", !!S.pad.connected);
  document.getElementById("xprofile").title = S.keys ? "Keyboard · test the keys" : S.pad.connected ? S.pad.name + " · test the controller" : "No controller connected";
  if (effectiveSkin() !== S.skin) { render(); renderPadStatus(); }
}
// the buttons' names, in the order the controller reports them
const PAD_NAMES = ["A", "B", "X", "Y", "LB", "RB", "LT", "RT", "VIEW", "MENU", "L3", "R3", "UP", "DOWN", "LEFT", "RIGHT", "XBOX"];
document.querySelectorAll("#xnav button, .xpower, #xprofile, #xwallet").forEach((b) => b.onclick = () => setView(b.dataset.view));
document.getElementById("xplay").onclick = start1P;
document.getElementById("xbig").onclick = (e) => { e.currentTarget.blur(); toggleBigScreen(); };
document.getElementById("xfav").onclick = toggleFav;
document.getElementById("xinfoBtn").onclick = showInfo;
document.getElementById("xadd").onclick = () => { beep("start"); send("add"); };

addEventListener("keydown", (e) => {
  if (e.metaKey) {
    // these also work from the page, in case the hidden menu bar does not see them
    if (e.key === "q" || e.key === "Q") { e.preventDefault(); send("quit"); }
    else if (e.ctrlKey && (e.key === "f" || e.key === "F")) { e.preventDefault(); send("fullscreen"); }
    return;
  }
  const k = e.key;
  if (S.web) { if (k === "Escape") exitWeb(); return; }
  if (k === "ArrowUp") move(0, -1);
  else if (k === "ArrowDown") move(0, 1);
  else if (k === "ArrowLeft") move(-1, 0);
  else if (k === "ArrowRight") move(1, 0);
  else if (k === "Enter" || k === " " || k === "1") { e.preventDefault(); start1P(); }
  else if (k === "c" || k === "C" || k === "5") insertCoin();
  else if (k === "f" || k === "F") toggleFav();
  else if (k === "i" || k === "I") showInfo();
  else if (k === "b" || k === "B") toggleBigScreen();
  else if (k === "Escape") { if (idleBigScreen()) bigScreen(false); else if (S.running) stopGame("Esc in Coinsole"); else if (S.view !== "home") { beep("back"); setView("home"); } else send("exitFullscreen"); } // Esc on home: leave full screen
  else return;
  e.preventDefault();
});

if (matchMedia("(prefers-reduced-motion: reduce)").matches) { boot.started = true; endIntro(); }      // "Reduce motion" in macOS: no animation
buildKeyboard();
send("list");
setTimeout(playIntro, 1500);   // even if the game list is late (macOS may be asking for folder access)
render();
</script>
