<!doctype html>
<html><head><meta charset="utf-8"><title>Frisbee Beach</title>
<style>
  @font-face { font-family: "Frisbee Pixel"; src: url("FrisbeePixel.ttf"); }
  @font-face { font-family: "Frisbee Pixel Outline"; src: url("FrisbeePixelOutline.ttf"); }
  @font-face { font-family: "Frisbee Pixel Outline Small"; src: url("FrisbeePixelOutlineSmall.ttf"); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="game.js"></script>
<script>
// Plays Frisbee Beach outside Evom: the same timeline and states, the same controls (plus a game
// controller), and little synth sounds for the events the game sends.
const VW = 1920, VH = 1080, FPS = 60;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function fit() { const s = Math.min(innerWidth / VW, innerHeight / VH); cv.style.width = VW * s + "px"; cv.style.height = VH * s + "px"; }
addEventListener("resize", fit); fit();
const COVER = /[?&]cover\b/.test(location.search);

// ---- the state machine (same as the template) ----
const STATES = {
  "Title": { a: 0, b: 1.5, loop: false, next: "Title loop" },
  "Title loop": { a: 1.5, b: 2, loop: true },
  "Playing": { a: 2, b: 4, loop: true },
  "Beach clear": { a: 4.2, b: 5, loop: false, next: "Clear result" },
  "Clear result": { a: 5, b: 6, loop: true },
  "Game over": { a: 6.2, b: 7, loop: false, next: "Over result" },
  "Over result": { a: 7, b: 8, loop: true },
};
const ON = { start: { "Title": "Playing", "Title loop": "Playing" }, win: { "Playing": "Beach clear" }, gameover: { "Playing": "Game over" }, restart: { "Clear result": "Playing", "Over result": "Playing" } };
let state = COVER ? "Title loop" : "Title", age = COVER ? 0.2 : 0;
function fire(trigger) { const to = (ON[trigger] || {})[state]; if (to) { state = to; age = 0; } }
function timeline() {
  const s = STATES[state], len = s.b - s.a;
  if (s.loop) return s.a + (age % len);
  if (age >= len) { state = s.next; age = 0; return STATES[state].a; }
  return s.a + age;
}

// ---- inputs (the names the game reads) ----
const I = { left: 0, right: 0, down: 0, jumpHeld: 0, fireHeld: 0, jumpCount: 0, fireCount: 0, round: 0 };
const KEYS = { left: ["ArrowLeft", "KeyA"], right: ["ArrowRight", "KeyD"], down: ["ArrowDown", "KeyS"], jump: ["Space", "KeyX", "ArrowUp", "KeyW"], fire: ["KeyZ"], go: ["Space", "Enter"] };
const K = {};
function startOrRestart() { I.round++; fire("start"); fire("restart"); }
addEventListener("keydown", (e) => {
  if (e.code === "Escape" && parent !== window) { parent.postMessage({ type: "arcade-exit" }, "*"); return; }
  if (e.code === "KeyF" && !e.repeat && parent !== window) { parent.postMessage({ type: "arcade-bigscreen" }, "*"); return; }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  K[e.code] = true;
  if (KEYS.jump.includes(e.code)) I.jumpCount++;
  if (KEYS.fire.includes(e.code)) I.fireCount++;
  if (KEYS.go.includes(e.code)) startOrRestart();
});
addEventListener("keyup", (e) => { K[e.code] = false; });
let forwarded = null;
addEventListener("message", (e) => { if (e.data && e.data.type === "arcade-pad") forwarded = e.data; });
const prevPad = {};
function readPad() {
  let b = [], a = [];
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find((q) => q && q.connected) : null;
  if (gp) { b = gp.buttons.map((x) => x.pressed); a = [...gp.axes]; }
  if (forwarded) {
    (forwarded.b || []).forEach((v, i) => { b[i] = b[i] || !!v; });
    (forwarded.a || []).forEach((v, i) => { if (Math.abs(v || 0) > Math.abs(a[i] || 0)) a[i] = v; });   // the stick that moves wins
  }
  const btn = (i) => !!b[i], ax = (i) => a[i] || 0;
  const pad = {
    left: btn(14) || ax(0) < -0.5, right: btn(15) || ax(0) > 0.5, down: btn(13) || ax(1) > 0.5,
    jump: btn(0) || btn(12) || btn(3), fire: btn(2) || btn(1), menu: btn(9),
  };
  // presses: A jumps (and starts / restarts, like Space), X or B throws, Menu starts
  if (pad.jump && !prevPad.jump) { I.jumpCount++; startOrRestart(); }
  if (pad.fire && !prevPad.fire) I.fireCount++;
  if (pad.menu && !prevPad.menu) startOrRestart();
  Object.assign(prevPad, pad);
  const key = (list) => list.some((c) => K[c]);
  I.left = +(key(KEYS.left) || pad.left);
  I.right = +(key(KEYS.right) || pad.right);
  I.down = +(key(KEYS.down) || pad.down);
  I.jumpHeld = +(key(KEYS.jump) || pad.jump);
  I.fireHeld = +(key(KEYS.fire) || pad.fire);
}

// ---- sounds: small synth voices standing in for Evom's sound set ----
const SOUND = {"pitch":{"go":0,"jump":0,"throw":7,"land":0,"crab-hit":0,"gull-hit":5,"fish-hit":-3,"boss-in":0,"boss-hit":0,"boss-die":0,"boss-hop":-7,"boss-shoot":0,"pop":0,"pickup":0,"weapon":0,"shirt":0,"hurt":0,"lose-life":0,"splash":-5,"respawn":0,"checkpoint":0,"win":0,"gameover":-5,"rise":-5,"gull":12,"fish":3,"tick":0,"m0":0,"m2":4,"m3":7,"m4":9,"m6":7,"m7":4,"m8":5,"m10":9,"m11":12,"m12":11,"m14":7,"m16":0,"m18":4,"m19":7,"m20":9,"m22":7,"m23":4,"m24":2,"m26":5,"m27":9,"m28":7,"m30":0,"b0":0,"b1":0,"b2":5,"b3":7,"b4":0,"b5":0,"b6":2,"b7":7},"sound":{"go":"coin","jump":"hop-jump","throw":"whoosh","land":"hop-land","crab-hit":"stomp","gull-hit":"stomp","fish-hit":"stomp","boss-in":"riser","boss-hit":"bump","boss-die":"boom","boss-hop":"hop-land","boss-shoot":"bubble","pop":"pop","pickup":"coin","weapon":"power","shirt":"chime","hurt":"hurt","lose-life":"lose","splash":"bubble","respawn":"hop-gem","checkpoint":"ping","win":"fanfare","gameover":"lose","rise":"pop","gull":"whoosh","fish":"bubble","tick":"blip","m0":"hop-note","m2":"hop-note","m3":"hop-note","m4":"hop-note","m6":"hop-note","m7":"hop-note","m8":"hop-note","m10":"hop-note","m11":"hop-note","m12":"hop-note","m14":"hop-note","m16":"hop-note","m18":"hop-note","m19":"hop-note","m20":"hop-note","m22":"hop-note","m23":"hop-note","m24":"hop-note","m26":"hop-note","m27":"hop-note","m28":"hop-note","m30":"hop-note","b0":"hop-bass","b1":"hop-bass","b2":"hop-bass","b3":"hop-bass","b4":"hop-bass","b5":"hop-bass","b6":"hop-bass","b7":"hop-bass"}};
let AC = null;
function tone(freq, dur, type = "square", vol = 0.05, slide = 0, delay = 0) {
  if (COVER) return;
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator(), v = AC.createGain(), t = AC.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const VOICES = {
  "coin": (k) => { tone(988 * k, 0.06); tone(1319 * k, 0.12, "square", 0.05, 0, 0.06); },
  "hop-jump": (k) => tone(320 * k, 0.14, "square", 0.05, 2),
  "hop-land": (k) => tone(140 * k, 0.06, "triangle", 0.08),
  "whoosh": (k) => tone(900 * k, 0.12, "sawtooth", 0.03, 0.35),
  "stomp": (k) => tone(260 * k, 0.1, "square", 0.06, 0.4),
  "riser": (k) => tone(180 * k, 0.7, "sawtooth", 0.04, 4),
  "bump": (k) => tone(160 * k, 0.08, "square", 0.07),
  "boom": (k) => { tone(120 * k, 0.6, "sawtooth", 0.08, 0.2); tone(60 * k, 0.8, "triangle", 0.1, 0.5); },
  "bubble": (k) => tone(420 * k, 0.1, "sine", 0.07, 2),
  "pop": (k) => tone(700 * k, 0.05, "sine", 0.07),
  "power": (k) => [523, 659, 784, 1047].forEach((f, i) => tone(f * k, 0.08, "square", 0.05, 0, i * 0.06)),
  "chime": (k) => { tone(1047 * k, 0.25, "triangle", 0.06); tone(1568 * k, 0.3, "triangle", 0.04, 0, 0.08); },
  "hurt": (k) => tone(330 * k, 0.25, "square", 0.06, 0.4),
  "lose": (k) => tone(440 * k, 0.6, "triangle", 0.08, 0.35),
  "hop-gem": (k) => tone(880 * k, 0.12, "triangle", 0.06, 1.5),
  "ping": (k) => tone(1320 * k, 0.15, "sine", 0.06),
  "fanfare": (k) => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f * k, 0.16, "square", 0.05, 0, i * 0.12)),
  "blip": (k) => tone(880 * k, 0.03, "square", 0.04),
  "hop-note": (k) => tone(523 * k, 0.11, "square", 0.025),
  "hop-bass": (k) => tone(131 * k, 0.16, "triangle", 0.07),
};
function play(name) {
  const voice = VOICES[SOUND.sound[name]];
  if (voice) voice(Math.pow(2, (SOUND.pitch[name] || 0) / 12));
}

// ---- Evom's helpers for code layers (p) ----
function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash1(n, seed) { const x = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return x - Math.floor(x); }
const SEED = 0, lerp = (a, b, k) => a + (b - a) * k, fade = (k) => k * k * (3 - 2 * k);
const v2 = (ix, iy) => hash1(ix * 57 + iy * 131, SEED);
const noise = (x, y = 0) => { const ix = Math.floor(x), iy = Math.floor(y), fx = fade(x - ix), fy = fade(y - iy); return lerp(lerp(v2(ix, iy), v2(ix + 1, iy), fx), lerp(v2(ix, iy + 1), v2(ix + 1, iy + 1), fx), fy) * 2 - 1; };
const nativeRandom = Math.random;

// ---- title screen (the template's title layers) ----
function title(t) {
  const center = (s, x, y, font, col) => { ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = col; ctx.fillText(s, x, y); };
  center("FRISBEE", 972, 243, '150px "Frisbee Pixel Outline"', "#14234f"); center("FRISBEE", 972, 243, '150px "Frisbee Pixel"', "#ffffff");
  center("BEACH", 972, 423, '150px "Frisbee Pixel Outline"', "#14234f"); center("BEACH", 972, 423, '150px "Frisbee Pixel"', "#ffd54f");
  if (t >= 0.9) {
    const panel = (x, y, w, h, op) => { ctx.globalAlpha = op; ctx.fillStyle = "#14234f"; ctx.fillRect(x - w / 2, y - h / 2, w, h); ctx.globalAlpha = 0.6; ctx.fillStyle = "#fff";
      ctx.fillRect(x - w / 2, y - h / 2 - 6, w, 6); ctx.fillRect(x - w / 2, y + h / 2, w, 6); ctx.fillRect(x - w / 2 - 6, y - h / 2, 6, h); ctx.fillRect(x + w / 2, y - h / 2, 6, h); ctx.globalAlpha = 1; };
    panel(960, 579, 1680, 66, 0.7); panel(963, 675, 1422, 66, 0.5);
    center("THROW FRISBEES - DUCK THE GULLS - BEAT THE GIANT CRAB", 964, 579, '40px "Frisbee Pixel"', "#ffffff");
    center("STICK MOVE - DOWN DUCKS - A JUMP - X THROW", 964, 675, '40px "Frisbee Pixel"', "#dff6ff");
  }
  const blinkOn = t >= 1.2 && (t < 1.5 ? true : ((t - 1.5) % 0.5) < 0.33);
  if (blinkOn) { center("PRESS A OR SPACE TO START", 963, 771, '30px "Frisbee Pixel Outline Small"', "#b8322b"); center("PRESS A OR SPACE TO START", 963, 771, '30px "Frisbee Pixel"', "#ffffff"); }
}

// ---- main loop ----
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!COVER) { readPad(); age += dt; }
  const t = timeline(), f = Math.round(t * FPS);
  const emitted = [];
  const p = Object.freeze({
    width: VW, height: VH, t, frame: f, fps: FPS, duration: 8, progress: 0, intensity: 1, color: "#ffffff", gradient: "", seed: SEED,
    rand: (i) => hash1(Number(i) || 0, SEED), noise, lerp,
    clamp: (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), ease: (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3),
    audio: () => ({ level: 0, bass: 0, mid: 0, high: 0, hit: 0, beat: 0, phase: 0, count: 0, bar: 0, barCount: 0, bpm: 0 }),
    inputs: Object.freeze({ ...I }), emit: (n) => { if (typeof n === "string" && emitted.length < 16) emitted.push(n); }, set: () => {},
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = "none";
  ctx.fillStyle = "#7fcff6"; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(VW / 2, VH / 2);
  Math.random = mulberry(SEED * 7919 + f * 31 + 7);      // Evom seeds the dice per frame
  try { gameFrame(ctx, t, p); } catch (e) { console.error(e); }
  Math.random = nativeRandom;
  ctx.restore();
  if (state === "Title" || state === "Title loop") title(t);
  for (const n of emitted) { play(n); if (n === "win") fire("win"); if (n === "gameover") fire("gameover"); }
  window.__next = requestAnimationFrame(frame);
}
const go = () => COVER ? (frame(performance.now()), cancelAnimationFrame(window.__next), (window.coverReady = true)) : requestAnimationFrame(frame);
Promise.all(["Frisbee Pixel", "Frisbee Pixel Outline", "Frisbee Pixel Outline Small"].map((f) => document.fonts.load('40px "' + f + '"'))).then(go, go);
</script></body></html>
